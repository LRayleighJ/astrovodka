name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor and the oldest version the code is tested
        # on; the rest guard the upper end of the range in pyproject.toml.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v

  import-smoke-test:
    # The minimum install: core dependencies only, no h5py/matplotlib/
    # multiprocess. `import astrovodka` must work, and the optional packages
    # must stay behind lazy imports.
    name: import with core dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import
        run: |
          python -c "import astrovodka; print(astrovodka.__version__)"
          python -c "import astrovodka.himodel as m; print(m.METHODS)"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .

  docs:
    # docs/html/ is generated from docs/{en,zh}/*.md. This job regenerates it
    # and fails if the committed HTML has drifted from the Markdown sources.
    name: docs are in sync with their Markdown sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild HTML docs
        run: python docs/build_html.py
      - name: Fail if the committed HTML is stale
        run: |
          if ! git diff --quiet -- docs/html; then
            echo "::error::docs/html/ is out of date. Run 'python docs/build_html.py' and commit the result."
            git diff --stat -- docs/html
            exit 1
          fi
